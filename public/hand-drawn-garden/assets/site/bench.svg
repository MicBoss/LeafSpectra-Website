<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 70" width="360" height="70"><defs>
<filter id="rough" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="1600"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/><feColorMatrix in="n" values="0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
</defs><style>
.sw{transform-box:view-box;animation:sw 7s ease-in-out infinite}
.lf{animation:lf 5s ease-in-out infinite}
.lf.b{animation-duration:6.2s;animation-delay:-2s}.lf.c{animation-duration:4.4s;animation-delay:-3.1s}
@keyframes sw{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.1deg)}}
@keyframes lf{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
